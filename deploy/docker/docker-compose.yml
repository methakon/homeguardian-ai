# HomeGuardian AI hub — Docker Compose deployment (milestone D-01).
#
#   cd deploy/docker
#   cp secrets/creds.json.example secrets/creds.json     # synthetic demo token
#   docker compose build
#   docker compose up -d
#   docker compose ps          # health should be "healthy"
#   docker compose logs -f
#   docker compose down        # state stays in the named volume
#
# TWO services, TWO boundaries (D-01 + D-03):
#
#   hub     - the existing C++ hub. Its HTTP listener is LOOPBACK ONLY inside the
#             container and is NOT published here on purpose: it was designed and
#             security-reviewed for loopback. To view the dashboard from this host,
#             use the opt-in override that binds the host side to 127.0.0.1:
#               docker compose -f docker-compose.yml -f docker-compose.loopback.yml up -d
#
#   ingress - the D-03 device ingestion boundary. This is the ONLY service the
#             default deployment publishes (8443/tcp). It speaks mutually
#             authenticated TLS and one protocol: compact observation frames. It
#             serves no dashboard, no commands and no SQLite, so exposing it does
#             not expose the loopback-only surface above.
#
# Provision the certificate material first (the container includes the tool):
#   bash tools/provision_ca.sh init  --ca-dir <offline> --runtime-dir <dir> --device-dir <devkeys>
#   bash tools/provision_ca.sh issue <device-id> --ca-dir <offline> --runtime-dir <dir> --device-dir <devkeys>
#   cp deploy/docker/config/ingress.json.example <dir>/ingress.json   # then edit the paths
# then export HG_CERTS_DIR=<dir> and register the device in <dir>/devices.json (the issue
# command prints the exact entry). HG_CERTS_DIR has NO DEFAULT: an unprovisioned mount fails the
# compose run itself, and if the directory is present but incomplete the entrypoint prints every
# missing file plus these commands and exits 78.

services:
  hub:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: runtime
      args:
        HG_NPROC: "4"
    image: homeguardian-hub:${HG_TAG:-local}

    # `init: true` runs a tiny PID-1 init: it forwards SIGTERM and reaps children,
    # which is what makes `docker compose stop` a clean shutdown for the hub.
    init: true

    # On failure or host reboot, come back up; a deliberate `docker compose stop`
    # is respected (`unless-stopped`).
    restart: unless-stopped

    # Least privilege: no new privileges, drop every Linux capability. The hub
    # needs none of them (no raw sockets, no device access, no setuid).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Resource ceilings (Compose v2 honours these for local runs).
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    pids_limit: 128

    # No `ports:` on purpose (see the header). No device passthrough, no
    # privileged mode, no docker.sock mount.
    volumes:
      - hg_data:/data

    # Configuration and credentials are mounted read-only. Nothing sensitive is
    # baked into an image layer. Credentials come from the `hg_creds` secret.
    secrets:
      - hg_creds

    environment:
      HG_PORT: "8080"
      # The demo deployment declares its synthetic token here; the IMAGE deliberately bakes none
      # (a real deployment replaces this value).
      HG_TOKEN: "demo-token"
      HG_DATA_DIR: "/data"
      HG_CONFIG: "/etc/homeguardian/hub.json"
      HG_CREDS: "/run/secrets/hg_creds"

    # Give the hub time to close SQLite cleanly on stop.
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # D-03 device ingestion boundary: the only published port in this deployment.
  # ---------------------------------------------------------------------------
  ingress:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: runtime
      args:
        HG_NPROC: "4"
    image: homeguardian-hub:${HG_TAG:-local}
    # This service is ALREADY built by the `hub` service (same image/tag), so a
    # plain `docker compose up -d` does not rebuild it twice.
    pull_policy: never

    init: true
    restart: unless-stopped

    # Same least-privilege posture as the hub: the ingress needs no capability and
    # no device access to terminate TLS and read a certificate.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 128

    # THE ONLY PUBLISHED PORT. 8443/tcp on the LAN speaks TLS with a private CA;
    # there is no plaintext listener to fall back to.
    ports:
      - "${HG_INGRESS_BIND:-0.0.0.0}:${HG_INGRESS_PORT:-8443}:8443/tcp"

    # Certificate material is mounted READ-ONLY. The registry/revocation files are
    # operator-controlled inputs, not image content.
    # ONE read-only mount for the whole credential directory. The individual-file
    # mounts this replaced had a deployment footgun: when a source FILE does not
    # exist, Docker creates a DIRECTORY with that name (as root) instead of
    # failing, so a forgotten `provision_ca.sh issue` step silently produced
    # directories where certificates should be. With a single directory mount, a
    # missing file is simply a missing file, and the ingress refuses to start.
    volumes:
      # REQUIRED, with no default: mounting an empty or wrong directory only moves the failure into
      # the container, where it reads as a certificate bug instead of an unprovisioned deployment.
      # Compose refuses to start without it, naming what to set.
      - ${HG_CERTS_DIR:?set HG_CERTS_DIR to the directory tools/provision_ca.sh provisioned (it must contain ingress.json, server.crt, server.key, ca/ca.crt and devices.json, and must be readable by the container uid - see docs/DISTRIBUTED_DEPLOYMENT.md)}:/etc/homeguardian/certs:ro
      # SHARED with the hub, deliberately: an alert produced from an ingested
      # observation is written into the same SQLite file the dashboard reads, so
      # the outcome is observable in the running hub rather than only inside the
      # ingress. SQLite in WAL mode with a 5 s busy timeout serializes the writers.
      - hg_data:/data
      - hg_ingress_data:/data/ingress

    environment:
      # The config lives INSIDE the mounted credential directory, so there is
      # exactly one host path to provision and one read-only mount to reason about.
      HG_INGRESS_CONFIG: "/etc/homeguardian/certs/ingress.json"
      HG_INGRESS_DATA: "/data/ingress"
      # Service-specific health probe: the name the server certificate's SAN must cover.
      # Defaults to "localhost"; there is no option to skip the identity check.
      HG_INGRESS_HEALTH_HOST: "${HG_INGRESS_HEALTH_HOST:-localhost}"

    entrypoint: ["/usr/local/bin/hg-ingress-entrypoint"]

    # SERVICE-SPECIFIC health check. The image-level HEALTHCHECK probes the HUB's loopback HTTP
    # API on 8080; this container runs hg_device_ingress on 8443 and nothing else, so it inherited
    # a probe that could never pass - `docker ps` said "unhealthy" while the ingress was serving
    # mutual TLS correctly. The hub service keeps the image-level probe, unchanged.
    #
    # This probe is NOT a TCP port check (a port check passes for any process holding the port).
    # It runs a real TLS handshake and verifies the server certificate against the mounted private
    # CA and the expected name, reporting mutual-TLS demand separately. It does not authenticate a
    # device - this container holds no device key by design - and it opens no new listener.
    # Override HG_INGRESS_HEALTH_HOST (default "localhost") if a deployment's SAN does not carry
    # that name; there is no option to skip verification.
    healthcheck:
      test: ["CMD", "/usr/local/bin/hg-ingress-healthcheck"]
      interval: 30s
      timeout: 8s
      start_period: 10s
      retries: 3

    # Give the ingress time to close SQLite cleanly and let in-flight acks finish.
    stop_grace_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # MCP reader: a READ-ONLY view of the application's own alert store.
  # ---------------------------------------------------------------------------
  # Option A of docs/HG_OBSERVATION_TO_MCP_SEAM_24.md. There is exactly ONE writer of the store (the
  # ingress above, which runs Observation -> Event -> Pipeline -> AlertPolicy and commits alerts); this
  # service only READS it. Two defences, deliberately redundant: the volume is mounted read-only, and the
  # process itself opens the database read-only (SQLITE_OPEN_READONLY + PRAGMA query_only), so a write
  # cannot succeed even if the mount were relaxed.
  #
  # A store it cannot open is reported as UNAVAILABLE - never as "no alerts". If this service says the
  # application is unavailable, point HG_MCP_ALERTS_DB at the store the ingress actually writes; do not
  # "fix" it by creating one (a reader that creates what it reads turns "no storage" into "no alerts").
  mcp:
    image: homeguardian-hub:${HG_TAG:-local}
    pull_policy: never
    init: true
    restart: unless-stopped

    # Host networking ON PURPOSE. The MCP binds loopback inside its own namespace, which is the right
    # posture but unreachable through a published port: a publish arrives on the container interface,
    # where nothing is listening (the same reason the hub publishes nothing). With `network_mode: host`
    # the loopback bind IS the host's loopback, so no port is published and no non-loopback bind or
    # HG_MCP_ALLOW_REMOTE is needed.
    network_mode: host

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 64

    # The store: READ-ONLY, the same file the hub and the ingress share.
    volumes:
      - hg_data:/data:ro
      # MCP credentials. This is a BIND mount rather than a compose secret on purpose: the credential
      # store requires a 0600 file owned by the effective uid, and refuses anything else (that check is a
      # feature, not an obstacle). It has no default - an unprovisioned mount must fail loudly instead of
      # serving unauthenticated.
      - ${HG_MCP_CREDS_FILE:?set HG_MCP_CREDS_FILE to a 0600 MCP credential file owned by uid ${HG_MCP_UID_GID:-10001} (see docs/MCP_OWNER_ENDPOINT.md)}:/run/secrets/hg_mcp_creds:ro

    # Must be the uid that owns the credential file above (the image's own uid is 10001).
    user: "${HG_MCP_UID_GID:-10001:10001}"

    environment:
      # Point this at the store the application writes. The default matches the shipped
      # deploy/docker/config/ingress.json.example.
      HG_MCP_ALERTS_DB: "${HG_MCP_ALERTS_DB:-/data/homeguardian_bridge_audit.db}"
      HG_MCP_BIND: "127.0.0.1"
      HG_MCP_PORT: "${HG_MCP_PORT:-8790}"

    # The image's entrypoint belongs to the hub; run the reader directly. Its first argument is only read
    # for one boolean (whether capture is enabled), so the image's hub config keeps that answer consistent
    # with what the hub itself reports.
    entrypoint: ["/usr/local/bin/hg_mcp_server", "/etc/homeguardian/hub.json", "/run/secrets/hg_mcp_creds"]

    stop_grace_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hg_data:
    driver: local
  hg_ingress_data:
    driver: local

secrets:
  # A local file-backed secret: mounted read-only at /run/secrets/hg_creds.
  # Replace with an external secret store for anything beyond the synthetic demo
  # credential (see docs/DISTRIBUTED_DEPLOYMENT.md).
  hg_creds:
    file: ./secrets/creds.json
