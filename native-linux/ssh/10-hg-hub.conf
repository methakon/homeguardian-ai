# /etc/ssh/sshd_config.d/10-hg-hub.conf
#
# SSH policy for the Mi A3 MCP hub. This device is remotely administered and, once booted,
# may sit unattended on the local network, so SSH is the only inbound surface and is
# configured accordingly.
#
# Drop-in ordering: files in sshd_config.d are read in lexical order and the FIRST value
# wins, so this must sort before the distribution default (usually 00-*). If the distro
# ships its own drop-in, either rename this to sort earlier or remove conflicting directives.
#
# Validate before restarting:  sshd -t && sshd -T | grep -E 'permitrootlogin|passwordauth'

# --- authentication --------------------------------------------------------------------
# Keys only. No password authentication anywhere on this device.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
AuthenticationMethods publickey

# Root may not log in directly. Administrative work goes through the unprivileged account
# and, where escalation is genuinely needed, doas/sudo — never a root SSH session.
PermitRootLogin no

# No agent or X11 forwarding. This is a headless hub; neither is used, and agent forwarding
# would let a compromised device reach outward using the operator's keys.
AllowAgentForwarding no
X11Forwarding no
AllowTcpForwarding yes          # needed for the MCP tunnel
PermitTunnel no                 # no device-level tun over SSH
GatewayPorts no                 # forwarded ports stay bound to loopback, never 0.0.0.0

# --- access control --------------------------------------------------------------------
# Restrict which accounts may authenticate. Adjust if the hub uses a different account.
AllowUsers hub
# Limit source addresses to the authorized local network. Replace with the real subnet
# before deployment — do not widen this without a decision.
# Match Address 192.168.0.0/16,10.0.0.0/8
#   PermitRootLogin no

# --- session hygiene --------------------------------------------------------------------
LoginGraceTime 30
MaxAuthTries 3
MaxSessions 4
ClientAliveInterval 60
ClientAliveCountMax 3

# --- host keys -------------------------------------------------------------------------
# Only modern key types. ed25519 first; RSA kept for compatibility but never used alone.
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_rsa_key
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256
PubkeyAcceptedAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256
# The post-quantum hybrid is preferred where both ends support it.
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# --- logging ---------------------------------------------------------------------------
# No credentials or tokens are ever logged. Verbose logging is deliberately not enabled:
# it can capture authentication material in some configurations.
LogLevel VERBOSE
SyslogFacility AUTH
