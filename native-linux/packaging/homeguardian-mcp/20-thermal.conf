# HomeGuardian MCP — thermal-hardening drop-in
#
# WHY THIS EXISTS: this board has NO CPU die temperature sensor and NO passive
# thermal trip point. The three PMIC zones (rf-pa0, quiet, xo) watch an RF power
# amplifier, a quiet rail and a crystal - none of them tracks the CPU. The only
# thermal response available is a hard shutdown at 125 C.
#
# The kernel cannot protect the CPU, so the only real mitigation is to never
# generate meaningful sustained heat. This file bounds the workload so that the
# device stays inside the "idle phone" power envelope it was designed for.
#
# These values are CONSERVATIVE STARTING POINTS. They are not validated limits
# and must be re-derived from real physical measurement before unattended use.

[Unit]
# Do not start into an unknown thermal state.
ConditionPathExists=/etc/homeguardian/creds.json

[Service]
# --- bounded CPU -----------------------------------------------------------
# CPU0 takes most IRQs on this SoC; keep the service off it.
AllowedCPUs=1-7
CPUWeight=20
CPUQuota=25%
IOWeight=20

# --- bounded memory --------------------------------------------------------
# Measured idle RSS was 6,780 kB, so 256M is ~37x headroom. A leak is caught by
# the cgroup long before it becomes a memory-pressure or I/O event.
MemoryMax=256M
MemoryHigh=192M
MemorySwapMax=64M
TasksMax=64

# --- restrict background impact -------------------------------------------
Nice=10
IOSchedulingClass=idle
IOSchedulingPriority=7

# --- fail-closed restart ---------------------------------------------------
# A service that keeps dying is a signal, not something to retry at full tilt.
Restart=on-failure
RestartSec=30
StartLimitBurst=5
StartLimitIntervalSec=300

# --- startup thermal gate --------------------------------------------------
# Cannot see the CPU, but refuses to start if a zone the sensors CAN see is hot.
ExecStartPre=/usr/libexec/homeguardian/thermal-gate.sh

# --- leave evidence on stop ------------------------------------------------
ExecStopPost=/usr/libexec/homeguardian/thermal-record.sh
