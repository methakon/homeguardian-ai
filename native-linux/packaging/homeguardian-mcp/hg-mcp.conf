{
  "_comment": [
    "HomeGuardian MCP server config for the Mi A3 hub (laurel_sprout native Linux).",
    "No credentials live here. The bearer token is in a separate 0600 file that the",
    "systemd unit refuses to start without.",
    "This service is READ-ONLY by design: it exposes exactly two tools and cannot act."
  ],

  "server": {
    "name": "homeguardian-mcp",
    "version": "1.0.0",
    "protocol_version": "2025-11-25"
  },

  "listen": {
    "_comment": [
      "Loopback only. This is deliberate and must not be widened.",
      "Remote access is expected over an authenticated SSH tunnel or a private overlay",
      "network; the MCP port is never bound to a network interface.",
      "The engine also refuses to bind a wildcard address",
      "(refusing to bind wildcard address (0.0.0.0))."
    ],
    "host": "127.0.0.1",
    "port": 8790
  },

  "auth": {
    "_comment": [
      "Credential file is separate so it can be 0600 while this file stays 0644.",
      "Generated per-device with SecureRandom; never logged, never committed."
    ],
    "credentials_file": "/etc/homeguardian/creds.json",
    "require_bearer": true,
    "fail_closed": true
  },

  "tools": {
    "_comment": [
      "Exactly two read-only tools. Both are read-only; neither mutates state.",
      "Adding a third tool is a design change, not a config change."
    ],
    "get_homeguardian_status": {
      "enabled": true,
      "read_only": true,
      "description": "Current HomeGuardian capture state"
    },
    "get_alert_summary": {
      "enabled": true,
      "read_only": true,
      "description": "Summary of recorded alerts"
    }
  },

  "state": {
    "_comment": "Writable state lives here; the unit sets systemd StateDirectory.",
    "directory": "/var/lib/homeguardian"
  },

  "logging": {
    "_comment": [
      "Journal only. Credentials are never logged.",
      "Log level stays at info - higher verbosity risks capturing request material."
    ],
    "destination": "journal",
    "level": "info",
    "log_tokens": false
  },

  "capabilities": {
    "_comment": [
      "Explicitly none. This device is a hub, not a sensor: no camera, microphone,",
      "display, touchscreen, audio or motion. Those are optional hardware that was",
      "deliberately excluded from the critical path."
    ],
    "camera": false,
    "microphone": false,
    "display": false,
    "touchscreen": false,
    "audio": false,
    "motion_sensors": false
  }
}
